<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member Syllabus Viewer</title>
    <!-- PWA Setup -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#3b82f6">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%233b82f6'%3E%3Cpath d='M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5'/%3E%3C/svg%3E">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent; 
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        .dark ::-webkit-scrollbar-thumb {
            background: #475569; 
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
        
        .description-content img { max-width: 100%; height: auto; }
        .description-content p { margin-bottom: 1em; }
        
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-up {
            animation: fadeInUp 0.4s ease-out forwards;
        }

        #sidebar { transition: margin-left 0.3s ease-in-out; }
        .sidebar-collapsed { margin-left: -24rem; }
        
        /* Font customizer classes */
        .reader-sans { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        .reader-serif { font-family: ui-serif, Georgia, Cambria, "Times New Roman", Times, serif; }
        .reader-sm { font-size: 0.875rem; }
        .reader-base { font-size: 1rem; }
        .reader-lg { font-size: 1.125rem; }
        .reader-xl { font-size: 1.25rem; }
        .reader-2xl { font-size: 1.5rem; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-gray-900 dark:text-gray-100 flex h-screen overflow-hidden transition-colors duration-200">

    <!-- Sidebar -->
    <aside id="sidebar" class="w-full md:w-80 lg:w-96 flex-shrink-0 border-r border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 flex flex-col transition-all duration-300 z-10 absolute md:relative h-full">
        <div class="p-4 border-b border-gray-200 dark:border-gray-700 shadow-sm z-10 space-y-3">
            <div class="flex justify-between items-center">
                <h2 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-500 to-teal-400">Book Viewer</h2>
                <div class="flex gap-2">
                    <button id="export-notes-btn" title="Export Notes" class="p-2 rounded-lg bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 transition text-gray-600 dark:text-gray-300">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                    </button>
                    <button id="theme-toggle" class="p-2 rounded-lg bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 transition">
                        <span id="theme-icon">🌙</span>
                    </button>
                </div>
            </div>
            
            <div class="relative">
                <input type="text" id="search" placeholder="Search books..." class="w-full pl-10 pr-4 py-2 rounded-lg border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                <svg class="w-4 h-4 absolute left-3 top-2.5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            </div>
            
            <div class="flex flex-wrap gap-2 text-xs">
                <label class="flex items-center space-x-1 cursor-pointer">
                    <input type="checkbox" id="filter-desc" class="rounded text-blue-500">
                    <span class="text-gray-600 dark:text-gray-300">Has Desc</span>
                </label>
                <label class="flex items-center space-x-1 cursor-pointer">
                    <input type="checkbox" id="filter-fav" class="rounded text-yellow-500">
                    <span class="text-gray-600 dark:text-gray-300 flex items-center gap-1"><svg class="w-3 h-3 text-yellow-500" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path></svg> Favs</span>
                </label>
                <label class="flex items-center space-x-1 cursor-pointer">
                    <input type="checkbox" id="filter-comp" class="rounded text-green-500">
                    <span class="text-gray-600 dark:text-gray-300 flex items-center gap-1"><svg class="w-3 h-3 text-green-500" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path></svg> Done</span>
                </label>
                <span id="book-count" class="ml-auto text-gray-500 dark:text-gray-400 bg-gray-100 dark:bg-gray-700 px-1.5 py-0.5 rounded-md text-[10px] font-medium">0 items</span>
            </div>
            
            <!-- Progress Tracker -->
            <div class="mt-2">
                <div class="flex justify-between text-xs text-gray-500 dark:text-gray-400 mb-1">
                    <span>Reading Progress</span>
                    <span id="progress-text">0 / 0 (0%)</span>
                </div>
                <div class="w-full bg-gray-200 dark:bg-gray-700 rounded-full h-1.5">
                    <div id="progress-bar" class="bg-green-500 h-1.5 rounded-full transition-all duration-500" style="width: 0%"></div>
                </div>
            </div>
        </div>

        <div id="list" class="flex-1 overflow-y-auto p-2 space-y-1 bg-gray-50/50 dark:bg-gray-900/50">
            <div class="p-4 text-center text-gray-500 flex flex-col items-center justify-center h-40">
                <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-500 mb-2"></div>
                Loading index...
            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <main id="main-content" class="flex-1 flex flex-col h-full bg-gray-50 dark:bg-gray-900 w-full absolute md:relative z-20 md:z-auto transition-transform duration-300 transform translate-x-full md:translate-x-0">
        <!-- Top bar -->
        <div class="p-3 border-b border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 flex items-center justify-between shadow-sm sticky top-0 z-20">
            <div class="flex items-center">
                <button id="back-btn" class="md:hidden mr-3 p-2 rounded-full bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                </button>
                <button id="toggle-sidebar-btn" class="hidden md:flex items-center gap-2 mr-3 px-3 py-1.5 rounded-lg bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 transition text-sm font-medium">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h7"></path></svg>
                    <span id="toggle-sidebar-text">Hide Sidebar</span>
                </button>
                <span class="font-semibold truncate max-w-[150px] sm:max-w-xs text-gray-800 dark:text-gray-200" id="mobile-title">Book Details</span>
            </div>
            
            <!-- Font Settings -->
            <div class="flex items-center gap-1 sm:gap-2">
                <button id="font-decrease" class="p-1.5 rounded-md hover:bg-gray-100 dark:hover:bg-gray-700 text-gray-600 dark:text-gray-300" title="Decrease Font">A-</button>
                <button id="font-increase" class="p-1.5 rounded-md hover:bg-gray-100 dark:hover:bg-gray-700 text-gray-600 dark:text-gray-300 font-bold" title="Increase Font">A+</button>
                <button id="font-toggle" class="p-1.5 rounded-md hover:bg-gray-100 dark:hover:bg-gray-700 text-gray-600 dark:text-gray-300 text-sm font-medium border border-gray-200 dark:border-gray-700 ml-1">Serif</button>
            </div>
        </div>
        
        <div class="flex-1 overflow-y-auto p-4 md:p-6 lg:p-8 relative">
            <div id="viewer-area" aria-label="Main Book Content" class="reader-base reader-sans max-w-4xl mx-auto bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700 p-6 md:p-10 min-h-full transition-all duration-300">
                <div class="flex flex-col items-center justify-center h-[60vh] text-gray-400">
                    <svg class="w-24 h-24 opacity-20" fill="currentColor" viewBox="0 0 20 20"><path d="M9 4.804A7.968 7.968 0 005.5 4c-1.255 0-2.443.29-3.5.804v10A7.969 7.969 0 015.5 14c1.669 0 3.218.51 4.5 1.385A7.962 7.962 0 0114.5 14c1.255 0 2.443.29 3.5.804v-10A7.968 7.968 0 0014.5 4c-1.255 0-2.443.29-3.5.804V12a1 1 0 11-2 0V4.804z"></path></svg>
                    <p class="text-xl font-medium mt-4">Select a book to read its details</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Floating Notes Toggle -->
    <button id="floating-notes-btn" class="fixed bottom-6 right-6 z-50 bg-yellow-400 hover:bg-yellow-500 text-yellow-900 p-3 rounded-full shadow-lg transition-transform hover:scale-105 hidden" title="Take Notes">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
    </button>

    <!-- Floating Notes Panel -->
    <div id="floating-notes-panel" class="fixed bottom-24 right-6 z-50 w-80 md:w-96 bg-white dark:bg-gray-800 rounded-2xl shadow-2xl border border-gray-200 dark:border-gray-700 transition-all duration-300 transform translate-y-10 opacity-0 pointer-events-none flex flex-col hidden">
        <div class="p-3 border-b border-gray-200 dark:border-gray-700 flex justify-between items-center bg-yellow-50 dark:bg-yellow-900/10 rounded-t-2xl">
            <h3 class="text-sm font-bold text-gray-900 dark:text-white flex items-center gap-2">📝 Personal Notes</h3>
            <button id="close-notes-btn" class="text-gray-500 hover:text-gray-700 dark:hover:text-gray-300"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>
        </div>
        <div class="p-3">
            <textarea id="floating-book-notes" rows="6" class="w-full p-3 bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm reader-sans text-gray-800 dark:text-gray-200 resize-none" placeholder="Type your notes here..."></textarea>
            <p class="text-xs text-gray-500 mt-2 text-right" id="floating-note-status">Saved locally.</p>
        </div>
    </div>

    <!-- Floating Audio Player -->
    <div id="floating-audio-panel" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 z-50 w-[90%] max-w-md bg-white dark:bg-gray-800 rounded-2xl shadow-2xl border border-gray-200 dark:border-gray-700 transition-all duration-300 translate-y-20 opacity-0 pointer-events-none flex flex-col hidden p-3">
        <div class="flex justify-between items-center mb-2 px-1">
            <h3 class="text-sm font-bold text-gray-900 dark:text-white flex items-center gap-2">🎧 Now Playing</h3>
            <button id="close-audio-btn" class="text-gray-500 hover:text-gray-700 dark:hover:text-gray-300"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>
        </div>
        <audio id="floating-audio-player" controls class="w-full h-10 rounded-lg shadow-sm outline-none" preload="metadata"></audio>
    </div>

    <script>
        // --- 1. Service Worker Registration ---
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW setup failed:', err));
            });
        }

        // --- State Management ---
        let fullIndex = [];
        let favorites = JSON.parse(localStorage.getItem('favorites') || '[]');
        let completed = JSON.parse(localStorage.getItem('completed') || '[]');
        let fontSizes = ['reader-sm', 'reader-base', 'reader-lg', 'reader-xl', 'reader-2xl'];
        let currentFontIndex = parseInt(localStorage.getItem('fontIndex') || '1');
        let isSerif = localStorage.getItem('isSerif') === 'true';

        // --- DOM Elements ---
        const listEl = document.getElementById('list');
        const viewEl = document.getElementById('viewer-area');
        const searchInput = document.getElementById('search');
        const filterDesc = document.getElementById('filter-desc');
        const filterFav = document.getElementById('filter-fav');
        const filterComp = document.getElementById('filter-comp');
        const countEl = document.getElementById('book-count');
        const progressBar = document.getElementById('progress-bar');
        const progressText = document.getElementById('progress-text');
        const sidebar = document.getElementById('sidebar');
        const mainContent = document.getElementById('main-content');
        
        // --- Floating Notes Logic ---
        const floatNotesBtn = document.getElementById('floating-notes-btn');
        const floatNotesPanel = document.getElementById('floating-notes-panel');
        const floatNotesClose = document.getElementById('close-notes-btn');
        const floatNotesArea = document.getElementById('floating-book-notes');
        const floatNotesStatus = document.getElementById('floating-note-status');
        let currentLoadedBookId = null;

        floatNotesBtn.onclick = () => {
            floatNotesPanel.classList.remove('hidden');
            requestAnimationFrame(() => floatNotesPanel.classList.remove('opacity-0', 'translate-y-10', 'pointer-events-none'));
            floatNotesArea.focus();
        };
        floatNotesClose.onclick = () => {
            floatNotesPanel.classList.add('opacity-0', 'translate-y-10', 'pointer-events-none');
            setTimeout(() => floatNotesPanel.classList.add('hidden'), 300);
        };
        
        let floatSaveTimeout;
        floatNotesArea.oninput = () => {
            if(!currentLoadedBookId) return;
            floatNotesStatus.textContent = 'Saving...';
            clearTimeout(floatSaveTimeout);
            floatSaveTimeout = setTimeout(() => {
                localStorage.setItem(`note_${currentLoadedBookId}`, floatNotesArea.value);
                floatNotesStatus.textContent = 'Saved locally.';
            }, 500);
        };
        // --- Floating Audio Logic ---
        const floatAudioPanel = document.getElementById('floating-audio-panel');
        const floatAudioPlayer = document.getElementById('floating-audio-player');
        const floatAudioClose = document.getElementById('close-audio-btn');
        
        floatAudioClose.onclick = () => {
            floatAudioPlayer.pause();
            floatAudioPanel.classList.add('opacity-0', 'translate-y-20', 'pointer-events-none');
            setTimeout(() => floatAudioPanel.classList.add('hidden'), 300);
        };
        
        function playAudiobook(url) {
            floatAudioPlayer.src = url;
            floatAudioPanel.classList.remove('hidden');
            requestAnimationFrame(() => floatAudioPanel.classList.remove('opacity-0', 'translate-y-20', 'pointer-events-none'));
            floatAudioPlayer.play();
        }

        function setTheme(isDark) {
            document.documentElement.classList.toggle('dark', isDark);
            document.getElementById('theme-icon').textContent = isDark ? '☀️' : '🌙';
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        }
        setTheme(localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches));
        document.getElementById('theme-toggle').onclick = () => setTheme(!document.documentElement.classList.contains('dark'));

        // --- Typography Settings ---
        function applyTypography() {
            viewEl.classList.remove(...fontSizes, 'reader-sans', 'reader-serif');
            viewEl.classList.add(fontSizes[currentFontIndex]);
            viewEl.classList.add(isSerif ? 'reader-serif' : 'reader-sans');
            document.getElementById('font-toggle').textContent = isSerif ? 'Sans' : 'Serif';
            
            localStorage.setItem('fontIndex', currentFontIndex);
            localStorage.setItem('isSerif', isSerif);
        }
        
        document.getElementById('font-increase').onclick = () => { if(currentFontIndex < fontSizes.length-1) { currentFontIndex++; applyTypography(); } };
        document.getElementById('font-decrease').onclick = () => { if(currentFontIndex > 0) { currentFontIndex--; applyTypography(); } };
        document.getElementById('font-toggle').onclick = () => { isSerif = !isSerif; applyTypography(); };
        applyTypography(); // Apply on load

        // --- Sidebar Toggles ---
        let isSidebarCollapsed = false;
        document.getElementById('toggle-sidebar-btn').onclick = () => {
            isSidebarCollapsed = !isSidebarCollapsed;
            sidebar.classList.toggle('sidebar-collapsed', isSidebarCollapsed);
            sidebar.setAttribute('aria-hidden', isSidebarCollapsed);
            document.getElementById('toggle-sidebar-text').textContent = isSidebarCollapsed ? 'Show Sidebar' : 'Hide Sidebar';
        };
        document.getElementById('back-btn').onclick = () => {
            mainContent.classList.add('translate-x-full');
            sidebar.classList.remove('-translate-x-full');
        };

        // --- Fetch & Render List ---
        function updateProgress() {
            if(!fullIndex.length) return;
            const percentage = Math.round((completed.length / fullIndex.length) * 100);
            progressBar.style.width = percentage + '%';
            progressText.textContent = `${completed.length} / ${fullIndex.length} (${percentage}%)`;
        }

        fetch('/book_index.json')
            .then(res => {
                if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
                return res.json();
            })
            .then(data => {
                fullIndex = data;
                renderList();
                
                // URL Routing or Restore Last Read
                const urlParams = new URLSearchParams(window.location.search);
                let loadId = urlParams.get('book') || localStorage.getItem('lastReadBookId');
                
                if (loadId) {
                    const foundBook = fullIndex.find(b => b.id == loadId);
                    if(foundBook) {
                        setTimeout(() => {
                            const btn = document.querySelector(`button[data-id="${loadId}"]`);
                            if(btn) {
                               btn.classList.add('bg-blue-50', 'dark:bg-blue-900/40', 'border-blue-200', 'dark:border-blue-800');
                               btn.scrollIntoView({ behavior: "smooth", block: "center" });
                            }
                        }, 100);
                        loadBook(loadId, foundBook.title, false); // false to not push state again initially
                    }
                }
            })
            .catch(err => {
                listEl.innerHTML = `<div class="p-4 text-red-500 text-sm">Failed to load index:<br>${err.message}</div>`;
                console.error("Index load error:", err);
            });

        function renderList() {
            updateProgress();
            const term = searchInput.value.toLowerCase();
            const reqDesc = filterDesc.checked;
            const reqFav = filterFav.checked;
            const reqComp = filterComp.checked;
            
            const filtered = fullIndex.filter(book => {
                const idStr = String(book.id);
                if (reqDesc && !book.has_desc) return false;
                if (reqFav && !favorites.includes(idStr)) return false;
                if (reqComp && !completed.includes(idStr)) return false;
                return book.title.toLowerCase().includes(term);
            });

            countEl.textContent = `${filtered.length} items`;
            listEl.innerHTML = '';
            
            if (filtered.length === 0) {
                listEl.innerHTML = `<div class="p-8 text-center text-gray-400">No books found.</div>`;
                return;
            }

            const fragment = document.createDocumentFragment();
            filtered.forEach(book => {
                const idStr = String(book.id);
                const isFav = favorites.includes(idStr);
                const isComp = completed.includes(idStr);
                
                const btn = document.createElement('button');
                btn.setAttribute('data-id', book.id);
                btn.className = `w-full text-left p-3 rounded-xl transition-all mb-1 group flex flex-col focus:outline-none focus:ring-2 focus:ring-blue-500 border border-transparent hover:bg-gray-100 dark:hover:bg-gray-700/50`;
                
                const badges = [];
                if(book.has_desc) badges.push(`<span class="px-2 py-0.5 text-[10px] rounded-md bg-gray-200 dark:bg-gray-700 text-gray-600 dark:text-gray-300">Desc</span>`);
                if(isFav) badges.push(`<span class="px-1 py-0.5 text-[10px] text-yellow-500">⭐</span>`);
                if(isComp) badges.push(`<span class="px-1 py-0.5 text-[10px] text-green-500">✅</span>`);

                btn.innerHTML = `
                    <div class="flex justify-between items-start gap-2 w-full">
                        <span class="text-gray-800 dark:text-gray-200 font-medium line-clamp-2 leading-snug">${book.title}</span>
                        <div class="flex items-center shrink-0">${badges.join('')}</div>
                    </div>
                `;
                
                btn.onclick = () => {
                    document.querySelectorAll('#list button').forEach(b => b.classList.remove('bg-blue-50', 'dark:bg-blue-900/40', 'border-blue-200', 'dark:border-blue-800'));
                    btn.classList.add('bg-blue-50', 'dark:bg-blue-900/40', 'border-blue-200', 'dark:border-blue-800');
                    loadBook(book.id, book.title, true);
                };
                fragment.appendChild(btn);
            });
            listEl.appendChild(fragment);
        }

        let debounceTimer;
        searchInput.oninput = () => { clearTimeout(debounceTimer); debounceTimer = setTimeout(renderList, 200); };
        filterDesc.onchange = renderList;
        filterFav.onchange = renderList;
        filterComp.onchange = renderList;

        // --- Load Book Data ---
        function loadBook(id, title, updateUrl = true) {
            id = String(id);
            localStorage.setItem('lastReadBookId', id);
            
            if (updateUrl) {
                const newUrl = new URL(window.location);
                newUrl.searchParams.set('book', id);
                window.history.pushState({ path: newUrl.href }, '', newUrl.href);
            }

            if (window.innerWidth < 768) {
                mainContent.classList.remove('translate-x-full');
                sidebar.classList.add('-translate-x-full');
            }
            document.getElementById('mobile-title').textContent = title;

            viewEl.innerHTML = `<div class="flex flex-col justify-center items-center h-64 text-blue-500"><div class="animate-spin rounded-full h-12 w-12 border-b-2 border-t-2 border-blue-500 mb-4"></div></div>`;
            
            fetch(`/book_jsons/${id}.json`)
                .then(res => {
                    if (!res.ok) throw new Error("File not found or network error");
                    return res.json();
                })
                .then(data => {
                    const writer = data.book_writer && data.book_writer !== "null" ? data.book_writer : 'Unknown Writer';
                    const translator = data.book_translator && data.book_translator !== "null" ? data.book_translator : '';
                    
                    let pdfLink = '';
                    if (data.book_pdf && data.book_pdf !== "null" && data.book_pdf !== "") {
                        pdfLink = `<a href="${data.book_pdf}" target="_blank" class="px-4 py-2 bg-red-50 text-red-600 hover:bg-red-100 dark:bg-red-900/20 dark:text-red-400 rounded-lg text-sm font-semibold transition border border-red-200 dark:border-red-800/50 inline-block">📄 View PDF</a>`;
                    }

                    // Audio
                    let audioSection = '';
                    const audioUrl = (data.book_audio_hq && data.book_audio_hq !== "null") ? data.book_audio_hq : (data.book_audio && data.book_audio !== "null") ? data.book_audio : null;
                    if (audioUrl) {
                        audioSection = `
                        <div class="my-6">
                            <div class="p-4 bg-indigo-50 dark:bg-indigo-900/20 border border-indigo-200 dark:border-indigo-800/50 rounded-xl mb-2 flex justify-between items-center flex-wrap gap-2">
                                <h4 class="text-sm font-bold text-indigo-900 dark:text-indigo-300">🎧 Audiobook Available</h4>
                                <div class="flex gap-2 items-center">
                                    <button onclick="playAudiobook('${audioUrl}')" class="px-4 py-1.5 bg-indigo-600 text-white rounded-lg text-xs font-bold shadow hover:bg-indigo-700 transition">▶ Play Now</button>
                                    <a href="${audioUrl}" target="_blank" download class="px-4 py-1.5 bg-white dark:bg-gray-800 text-indigo-600 dark:text-indigo-400 border border-indigo-200 dark:border-indigo-700 rounded-lg text-xs font-bold shadow hover:bg-gray-50 transition">Download</a>
                                </div>
                            </div>
                        </div>`;
                    }

                    let coverImage = '';
                    if (data.book_image && data.book_image !== "null" && data.book_image !== "") {
                        coverImage = `<img src="${data.book_image}" onerror="this.style.display='none'" class="w-24 md:w-32 h-auto object-cover rounded-lg shadow float-right ml-4 mb-4" alt="Cover">`;
                    }

                    const description = data.book_description && data.book_description !== "null" && data.book_description.trim() !== "" 
                        ? `<div class="prose prose-blue dark:prose-invert max-w-none description-content text-gray-700 dark:text-gray-300 leading-relaxed">${data.book_description}</div>`
                        : `<div class="p-4 bg-gray-50 dark:bg-gray-800 rounded-xl border border-dashed border-gray-300 dark:border-gray-700 text-center text-gray-500 italic">No description available.</div>`;

                    // Action Buttons State
                    const isFav = favorites.includes(id);
                    const isComp = completed.includes(id);
                    const savedNote = localStorage.getItem(`note_${id}`) || '';

                    viewEl.innerHTML = `
                        <article class="animate-fade-in-up pb-20">
                            <div class="mb-6">
                                ${coverImage}
                                <h1 class="text-3xl md:text-4xl font-bold text-gray-900 dark:text-white mb-3">${data.book_title || title}</h1>
                                <p class="text-gray-600 dark:text-gray-400 text-sm mb-4"><strong>Writer:</strong> ${writer} ${translator ? `| <strong>Translator:</strong> ${translator}` : ''}</p>
                                
                                <div class="flex flex-wrap gap-2 mb-4">
                                    <button id="btn-fav" class="px-4 py-2 rounded-lg text-sm font-semibold transition border ${isFav ? 'bg-yellow-100 text-yellow-700 border-yellow-200 dark:bg-yellow-900/30 dark:text-yellow-400' : 'bg-gray-50 text-gray-600 border-gray-200 dark:bg-gray-800 dark:text-gray-400 dark:border-gray-700 hover:bg-gray-100 dark:hover:bg-gray-700'}">
                                        ${isFav ? '⭐ Favorited' : '☆ Add to Favorites'}
                                    </button>
                                    <button id="btn-comp" class="px-4 py-2 rounded-lg text-sm font-semibold transition border ${isComp ? 'bg-green-100 text-green-700 border-green-200 dark:bg-green-900/30 dark:text-green-400' : 'bg-gray-50 text-gray-600 border-gray-200 dark:bg-gray-800 dark:text-gray-400 dark:border-gray-700 hover:bg-gray-100 dark:hover:bg-gray-700'}">
                                        ${isComp ? '✅ Completed' : 'Mark as Read'}
                                    </button>
                                    ${pdfLink}
                                </div>
                                <div class="clear-none"></div>
                            </div>
                            
                            ${audioSection}
                            <hr class="border-gray-200 dark:border-gray-700 my-6">
                            
                            <div class="mt-4">
                                ${description}
                            </div>
                            
                        </article>
                    `;

                    // Bind Actions
                    document.getElementById('btn-fav').onclick = (e) => {
                        const idx = favorites.indexOf(id);
                        if(idx > -1) favorites.splice(idx, 1);
                        else favorites.push(id);
                        localStorage.setItem('favorites', JSON.stringify(favorites));
                        renderList();
                        loadBook(id, title, false); // re-render UI
                    };
                    
                    document.getElementById('btn-comp').onclick = (e) => {
                        const idx = completed.indexOf(id);
                        if(idx > -1) completed.splice(idx, 1);
                        else completed.push(id);
                        localStorage.setItem('completed', JSON.stringify(completed));
                        renderList();
                        loadBook(id, title, false); // re-render UI
                    };

                    // Floating Notes logic updates
                    currentLoadedBookId = id;
                    floatNotesArea.value = savedNote;
                    floatNotesStatus.textContent = 'Loaded.';
                    floatNotesBtn.classList.remove('hidden');

                })
                .catch(err => {
                    viewEl.innerHTML = `<div class="p-6 bg-red-50 text-red-600 rounded-xl text-center shadow-sm">Error: ${err.message}</div>`;
                });
        }

        // --- Export Notes Logic ---
        document.getElementById('export-notes-btn').onclick = () => {
            let exportData = "Member Syllabus Notes Export\n============================\n\n";
            let hasNotes = false;
            
            // Loop through localStorage
            for(let i=0; i<localStorage.length; i++) {
                const key = localStorage.key(i);
                if(key.startsWith('note_')) {
                    const id = key.replace('note_', '');
                    const noteContent = localStorage.getItem(key).trim();
                    if(noteContent) {
                        hasNotes = true;
                        // Find book title from index
                        const book = fullIndex.find(b => b.id == id);
                        const title = book ? book.title : `Book ID: ${id}`;
                        exportData += `--- ${title} ---\n${noteContent}\n\n`;
                    }
                }
            }

            if(!hasNotes) {
                alert("You don't have any notes saved yet!");
                return;
            }

            const blob = new Blob([exportData], { type: "text/plain;charset=utf-8" });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = "syllabus_notes.txt";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        };
        
        // Handle Back/Forward browser buttons
        window.addEventListener('popstate', (event) => {
            const urlParams = new URLSearchParams(window.location.search);
            const bookId = urlParams.get('book');
            if(bookId && fullIndex.length > 0) {
                const b = fullIndex.find(x => x.id == bookId);
                if(b) loadBook(b.id, b.title, false);
            }
        });
    </script>
</body>
</html>
